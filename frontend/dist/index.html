    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <script>
(function () {
  const currentHost = window.location.hostname;

  const domains = {
    vercel: "https://adityasportfoilo.vercel.app",
    netlify: "https://aditysportfolio.netlify.app"
  };

  function redirectToBackup() {
    if (currentHost === domains.vercel) {
      window.location.replace(
        `https://${domains.netlify}${window.location.pathname}${window.location.search}`
      );
    } else if (currentHost === domains.netlify) {
      window.location.replace(
        `https://${domains.vercel}${window.location.pathname}${window.location.search}`
      );
    }
  }

  window.addEventListener("error", () => {
    redirectToBackup();
  });

  window.addEventListener("unhandledrejection", () => {
    redirectToBackup();
  });
})();
